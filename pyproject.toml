[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "applicant-ranking-list-analyzer"
version = "0.1.0"
description = "Private lookup across locally loaded applicant ranking lists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3,<4",
    "pandas>=2.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["app", "logic", "ranking"]
